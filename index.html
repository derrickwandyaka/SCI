<!DOCTYPE html>
<html lang="en">
<a href="ONE.html">INVITATION CARD</a>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCI Dinner – Guest Invitation Card</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef0f7;--ink:#1a2240;--line:#ccd2e6;--panel:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1222;--ink:#e9ecf8;--line:#2a3255;--panel:#171d36}}
:root[data-theme="dark"]{--bg:#0e1222;--ink:#e9ecf8;--line:#2a3255;--panel:#171d36}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;padding:16px 12px 40px}
.wrap{max-width:520px;margin:0 auto}
#out{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.form h2{margin:0 0 8px;font-size:16px}
label{display:block;font-size:13px;margin:10px 0 4px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
button,a.btn{flex:1;min-width:140px;text-align:center;text-decoration:none;padding:11px;border-radius:8px;border:0;font-size:14px;font-weight:600;cursor:pointer;background:#243b8f;color:#fff}
.alt{background:#f5e61b!important;color:#16226b!important}
.note{font-size:12px;opacity:.75;margin-top:10px;line-height:1.5}
.hide{display:none}
body.locked .wrap{display:none}
#gate{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:var(--bg);padding:16px}
body.locked #gate{display:flex}
.gate-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:340px}
.gate-box h2{margin:0 0 10px;font-size:18px}
.gate-box button{width:100%;margin-top:12px}
.gate-err{color:#d33;font-size:13px;margin-top:8px;min-height:1em}
</style>
</head>
<body class="locked">

<div id="gate">
  <div class="gate-box">
    <h2>Enter passcode</h2>
    <input id="pc" type="password" placeholder="Passcode" autocomplete="off">
    <button id="pcBtn" type="button">Unlock</button>
    <div id="pcErr" class="gate-err"></div>
  </div>
</div>

<div class="wrap">
  ...your existing content...
<div class="wrap">
  <div class="form">
    <h2>Create a guest card</h2>
    <label for="gn">Guest name</label>
    <input id="gn" placeholder="e.g. Sarah Nakato" autocomplete="off">
    <label for="ic">Invitation code</label>
    <input id="ic" placeholder="e.g. SCI-2026-001" autocomplete="off">
    <label for="ga">Amount paid (UGX)</label>
    <input id="ga" type="number" inputmode="numeric" value="50000">
    <div class="btns">
      <a class="btn alt" id="dl" download="invitation.png" href="#">Download image</a>
      <button id="sh" class="hide">Share image</button>
    </div>
    <div class="note">Download the image, then attach it in WhatsApp. If Download doesn't work here, right-click the card (or press and hold on a phone) and choose Save image.</div>
  </div>
  <img id="out" alt="Invitation card">
</div>

  function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
  function wrap(c,t,max){var words=t.split(/\s+/),lines=[],cur='';words.forEach(function(w){var test=cur?cur+' '+w:w;if(c.measureText(test).width>max&&cur){lines.push(cur);cur=w}else cur=test});lines.push(cur);return lines}
  function draw(){
    if(!ready)return;
    var cv=document.createElement('canvas');cv.width=cv.height=1200;
    var c=cv.getContext('2d');

    c.font='700 74px Georgia, serif';
    var lines=wrap(c,name,inner);
    c.font='700 30px Georgia, serif';
    var codeLines=invitationCode?wrap(c,invitationCode,inner):[];
    var H=padY+36+12+lines.length*82+26+50+padY+52+(codeLines.length?40+codeLines.length*36:0);

    c.font='600 29px system-ui, Arial, sans-serif';c.fillStyle='#f5e61b';

    c.font='700 74px Georgia, serif';c.fillStyle='#fff';

    y+=lines.length*82+26;

    var fileName=blob.fname||'invitation.png';

    if(typeof File==='undefined'||!navigator.share){download();return}
    var file=new File([blob],fileName,{type:'image/png'});

  (function(){
  var PASSCODES = ['SCI-2026-A', 'SCI-2026-B'];   // your two passcodes

  function unlock(){
    document.body.classList.remove('locked');
    try{ sessionStorage.setItem('unlocked','1'); }catch(e){}
  }

  try{ if(sessionStorage.getItem('unlocked')==='1'){ unlock(); return; } }catch(e){}

  var input=document.getElementById('pc'),
      err=document.getElementById('pcErr');

  function check(){
    if(PASSCODES.indexOf(input.value.trim())!==-1){ unlock(); }
    else { err.textContent='Incorrect passcode.'; input.value=''; input.focus(); }
  }

  document.getElementById('pcBtn').addEventListener('click',check);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter') check(); });
})();
